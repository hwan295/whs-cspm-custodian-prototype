# 퍼블릭 액세스 차단이 완전히 켜져 있지 않은 버킷을 찾아 4개 항목을 모두 켠다.
#
# check-public-block 은 파라미터를 주지 않으면 4개 항목
# (BlockPublicAcls / BlockPublicPolicy / IgnorePublicAcls / RestrictPublicBuckets)
# 중 하나라도 미설정이거나 false 인 버킷을 남긴다.
#
# 이 체크는 mapping.yml 에서 mode: approve 다. 퍼블릭 접근을 끊는 조치라
# 정적 웹사이트 호스팅 버킷이 있으면 사이트가 내려간다. 사람이 확인해야 한다.
#
# 주의: 이 필터는 aws.s3(버킷 단위) 필터다. Prowler 의
# s3_account_level_public_access_blocks 는 계정 단위 설정을 보는 체크이므로
# 판정 단위가 다르다. 계정 단위로 맞추려면 resource 를 aws.account 로,
# 필터를 s3-public-block, 액션을 set-s3-public-block 으로 바꿔야 한다.
# (README 의 "알려진 차이점" 참고)
policies:
  - name: s3-account-public-block
    resource: aws.s3
    filters:
      - type: check-public-block
    actions:
      - type: set-public-block
        state: true
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
