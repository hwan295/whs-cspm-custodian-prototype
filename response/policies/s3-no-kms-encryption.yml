# KMS 기반 기본 암호화(SSE-KMS)가 설정되지 않은 버킷을 찾아 켠다.
#
# bucket-encryption 필터는 "조건에 맞는" 버킷을 남기므로,
# not 으로 감싸 "SSE-KMS 가 켜져 있지 않은" 버킷을 골라낸다.
# (암호화가 아예 없는 버킷 + AES256 로만 암호화된 버킷이 모두 걸린다)
#
# key 를 지정하지 않으면 AWS 관리형 키(aws/s3)를 쓴다. 고객 관리형 키가 필요하면
# key 파라미터를 추가하는데, 그러면 버킷마다 키가 달라질 수 있어 판정 기준
# 4단계(파라미터 고정 가능)를 다시 봐야 한다.
policies:
  - name: s3-no-kms-encryption
    resource: aws.s3
    filters:
      - not:
        - type: bucket-encryption
          state: true
          crypto: aws:kms
    actions:
      - type: set-bucket-encryption
        crypto: aws:kms
        enabled: true
