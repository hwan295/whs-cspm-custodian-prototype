# ============================================================
# IAM 정책 모음
#
# mapping.yml 에 등록된 IAM check_id 에 대응하는
# Custodian 정책을 하나의 파일에서 관리한다.
#
# 이번 파일은 auto_eligible=true 인 IAM Password Policy 6개의
# 뼈대만 작성한다. filters / actions 는 Custodian 문법 확인 후
# 후속 작업에서 채운다.
# ============================================================

policies:

  # ----------------------------------------------------------
  # iam_password_policy_lowercase
  #
  # 계정 전체 IAM Password Policy 의
  # RequireLowercaseCharacters 를 true 로 설정한다.
  # ----------------------------------------------------------

  - name: iam-password-policy-lowercase
    resource: aws.account

    description: >
      IAM 계정 Password Policy 의 소문자 요구 조건이
      활성화되어 있지 않은 계정

    filters: []  # TODO: Custodian filter 문법 확인
    actions: []  # TODO: Custodian action 문법 확인 후 작성

    metadata:
      prowler_check: iam_password_policy_lowercase

      approve:
        disruption: access
        blast_radius: account
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: >-
          IAM 계정 전체 Password Policy 변경 - 조직이 IAM 보안 baseline 정책을 운영할 때만 승격 권장

      auto:
        warning: >
          Auto 활성화 시 opt-in한 계정에서 동일 위반이 다시 탐지되면 사용자 승인 없이 해당 IAM Password Policy 요구 조건이 자동으로 적용됩니다. 이후 비밀번호 변경 시 새 요구사항이 적용될 수 있습니다.

        allowed_scopes:
          - account

        rollback_cli: null
        cooldown: 24h
        post_notification: log
