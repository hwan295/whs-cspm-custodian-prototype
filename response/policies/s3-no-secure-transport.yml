# HTTPS 를 강제하지 않는 버킷을 찾아 Deny 구문을 추가한다.
#
# 실행은 --dryrun 으로만 하므로 실제 정책은 바뀌지 않고 "무엇을 할 계획인지"만
# 출력된다. 실조치를 켜려면 executor 의 run_custodian(dry_run=False) 로 바꾼다.
#
# remove 를 쓰지 않는 이유: "*" 로 기존 구문을 전부 지우면 정당한 접근 허용까지
# 날아간다. Deny 구문만 얹는다.
policies:
  - name: s3-no-secure-transport
    resource: aws.s3
    filters:
      - not:
        - type: has-statement
          statements:
            - Effect: Deny
              Action: "s3:*"
              Condition:
                Bool:
                  "aws:SecureTransport": "false"
    actions:
      - type: set-statements
        statements:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Action: "s3:*"
            Principal:
              AWS: "*"
            Resource:
              - "arn:aws:s3:::{bucket_name}"
              - "arn:aws:s3:::{bucket_name}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
