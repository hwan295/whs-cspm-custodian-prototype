policies:

  # ----------------------------------------------------------
  # vpc_subnet_no_public_ip_by_default
  #
  # Public IP 자동 할당이 활성화된 Subnet을 찾는다.
  #
  # MapPublicIpOnLaunch가 true이면
  # 해당 Subnet에서 새로 생성되는 EC2 Instance가
  # Public IPv4 주소를 자동으로 받을 수 있다.
  #
  # 이를 false로 변경하여
  # Public IP가 기본으로 할당되지 않도록 한다.
  #
  # 기존 Public IP를 즉시 제거하는 정책은 아니다.
  # 이후 해당 Subnet에서 생성되는 리소스의
  # 기본 Public IP 할당 동작을 변경한다.
  #
  # 기존 배포 구조가 Public IP 자동 할당에 의존할 가능성이 있으므로
  # mapping.yml에서는 approve로 처리한다.
  # ----------------------------------------------------------

  - name: vpc-subnet-no-public-ip-by-default
    resource: aws.subnet

    description: >
      Public IPv4 주소를 기본으로 자동 할당하도록
      설정된 VPC Subnet

    metadata:
      prowler_check: vpc_subnet_no_public_ip_by_default

      approve:
        disruption: none
        blast_radius: resource
        propagation_delay: immediate
        reversible: true
        cost_impact: none
        risk_note: >-
          Public IP 자동 할당을 전제로 한 배포 구조에서는 이후 생성되는
          리소스의 네트워크 접근 방식에 영향을 줄 수 있으므로 승인 후 실행한다

    filters:
      - type: value
        key: MapPublicIpOnLaunch
        value: true

    actions:
      - type: modify
        MapPublicIpOnLaunch: false
