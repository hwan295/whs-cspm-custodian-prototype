policies:
  - name: elbv2-alb-drop-invalid-header-fields-enabled
    resource: aws.app-elb
    description: 비정상 HTTP 헤더 필드 차단이 비활성화된 ALB를 탐지하고, modify-attributes로 활성화한다.
    filters:
      - type: attributes
        key: routing.http.drop_invalid_header_fields.enabled
        value: false
    actions:
      - type: modify-attributes
        attributes:
          routing.http.drop_invalid_header_fields.enabled: true
    metadata:
      prowler_check: elbv2_alb_drop_invalid_header_fields_enabled
      approve:
        disruption: traffic
        blast_radius: resource
        propagation_delay: seconds
        reversible: true
        cost_impact: none
        risk_note: 비정상 HTTP 헤더를 사용하는 요청이 ALB에서 차단될 수 있으므로 승인 후 실행한다

  - name: elbv2-deletion-protection
    resource: aws.app-elb
    description: Deletion Protection이 비활성화된 ALB를 탐지하고, modify-attributes로 활성화한다.
    filters:
      - type: attributes
        key: deletion_protection.enabled
        value: false
    actions:
      - type: modify-attributes
        attributes:
          deletion_protection.enabled: true
    metadata:
      prowler_check: elbv2_deletion_protection
      approve:
        disruption: none
        blast_radius: resource
        propagation_delay: seconds
        reversible: true
        cost_impact: none
        risk_note: ALB 삭제 작업을 수행하려면 deletion protection을 먼저 해제해야 하므로 승인 후 실행한다
