# Prowler 의 metadata.event_code 를 Cloud Custodian 정책 이름에 연결한다.
# Custodian 은 findings 를 입력으로 받지 않고 AWS 를 직접 조회하므로,
# 두 도구의 유일한 연결점이 이 매핑이다.
#
# ── 스키마 (flat 7필드) ────────────────────────────────────────
#
# policy         Custodian 정책 이름 (policies/*.yml 의 name 과 매칭)
#                mode 가 manual / not_supported 면 null
#
# mode           approve / manual / not_supported (필수, default 없음)
#                - approve       : Custodian dryrun 실행 후 사용자 승인
#                - manual        : Custodian 표준화 불가, guide 로 사람이 직접
#                - not_supported : Custodian 이 리소스/필터/액션을 지원 안 함
#                (auto 는 판정 결과가 아님. approve 를 운영하며 사용자가 명시적으로 승격시킨 것 (Plus Alpha).)
#
# auto_eligible  auto 로 승격 가능한지 여부 (mode=approve 일 때만 필수)
#                true  : 사용자 opt-in 시 자동 실행 허용
#                false : 매 finding 마다 사용자 승인 필요
#
# auto_reason    auto 승격 부적합 사유 (auto_eligible=false 일 때만)
#                감사 대응 + 사용자 알림에 노출됨
#
# scope_key      Custodian 실행 시 리소스를 특정할 필드명
#                (S3 = Name, EC2 = InstanceId, IAM = UserName, CloudTrail = TrailARN 등)
#                Finding 의 리소스 식별 정보에서 scope_key 에 해당하는 값을 사용해 실행 범위를 좁힌다.
#                계정 단위 조치면 null.
#
# risk_note      이 mode 로 판정한 근거 (필수). 감사·로그에 함께 남는다.
#
# guide          mode=manual 일 때만. 사용자가 직접 수행할 조치 안내
#
# ── 판정 트리 (4단계 + auto_eligible) ──────────────────────────
#
# ① Custodian 으로 구현 가능한가?
#    NO  → not_supported
#    YES → ②
#
# ② 조치 대상과 방법을 확정할 수 있는가?
#    NO  → manual
#    YES → ③
#
# ③ 파괴적이거나 사람 판단이 필요한 조치인가?
#    YES → manual
#    NO  → ④
#
# ④ 그 외 → approve
#             ↓
#            ⑤ (approve 만) 사용자 opt-in 후 자동 실행돼도 안전한가?
#               모두 YES → auto_eligible: true
#               하나라도 NO → auto_eligible: false + auto_reason 명시
#
# ── 다른 파일과의 관계 ────────────────────────────────────────
#
# 액션 속성 (disruption / blast_radius / reversible 등) 은 여기 없다.
# → policies/*.yml 의 metadata.approve 로 이사했다.
#
# 실제 사용자 opt-in 상태 (누가 언제 승격했는지) 도 여기 없다.
# → DB 의 auto_opt_in 테이블에 저장된다.


