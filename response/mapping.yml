s3_account_level_public_access_blocks:
  policy: s3-account-level-public-access-blocks
  mode: approve
  auto_eligible: false
  auto_reason: 계정 전체 S3 접근에 영향, 기존 공개 접근 필요 여부 자동 검증 불가
  scope_key: null
  risk_note:
    계정 전체의 S3 Public Access Block 설정을 변경하면 기존 공개 접근이 필요한 버킷이나 애플리케이션의 접근이
    차단될 수 있으므로 승인 후 실행한다

s3_bucket_kms_encryption:
  policy: s3-bucket-kms-encryption
  mode: approve
  auto_eligible: false
  auto_reason: cross-account 접근 주체의 KMS 권한 영향 자동 검증 불가
  scope_key: Name
  risk_note:
    SSE-KMS 기본 암호화 적용 후 새로 저장되는 객체는 KMS 권한이 필요할 수 있으며, cross-account 접근 및
    KMS 요청 비용에 영향을 줄 수 있으므로 승인 후 실행한다

s3_bucket_secure_transport_policy:
  policy: s3-bucket-secure-transport-policy
  mode: approve
  auto_eligible: false
  auto_reason: 기존 HTTP 기반 S3 접근 클라이언트 사전 확인 불가
  scope_key: Name
  risk_note: HTTPS를 강제하는 Bucket Policy를 추가하면 기존 HTTP 기반 S3 접근이 차단될 수 있으므로 승인 후 실행한다

ec2_ebs_default_encryption:
  policy: ec2-ebs-default-encryption
  mode: approve
  auto_eligible: true
  scope_key: null
  risk_note: 계정/리전 EBS 기본 암호화 설정 변경 - 조직이 전체 암호화 정책일 때만 승격 권장

ec2_ebs_volume_snapshots_exists:
  policy: ec2-ebs-volume-snapshots-exists
  mode: approve
  auto_eligible: true
  scope_key: VolumeId
  risk_note: EBS Snapshot 생성은 가능하지만 Snapshot 저장에 추가 비용이 발생하므로 승인 후 실행한다

ec2_instance_account_imdsv2_enabled:
  policy: ec2-instance-account-imdsv2-enabled
  mode: approve
  auto_eligible: true
  scope_key: null
  risk_note: 계정 IMDS 기본값 변경 - 조직이 IMDSv2 강제 정책일 때만 승격 권장

ec2_instance_imdsv2_enabled:
  policy: ec2-instance-imdsv2-enabled
  mode: approve
  auto_eligible: false
  auto_reason: 인스턴스 내 IMDSv1 의존 애플리케이션·SDK 자동 검증 불가
  scope_key: InstanceId
  risk_note:
    기존 애플리케이션이나 SDK가 IMDSv1에 의존하는지 자동으로 확인할 수 없어 호환성 영향을 배제할 수 없으므로 승인 후
    실행한다

ec2_instance_detailed_monitoring_enabled:
  policy: ec2-instance-detailed-monitoring-enabled
  mode: approve
  auto_eligible: true
  scope_key: InstanceId
  risk_note:
    EC2 Detailed Monitoring 활성화는 서비스 중단 없이 가능하지만 CloudWatch Metric에 따른 추가
    비용이 발생하므로 승인 후 실행한다
ec2_securitygroup_allow_ingress_from_internet_to_any_port_from_ip:
  policy: ec2-securitygroup-allow-ingress-from-internet-to-any-port-from-ip
  mode: approve
  auto_eligible: false
  auto_reason: 제거 대상 ingress rule의 관리자·외부 서비스 정상 사용 여부 자동 확인 불가
  scope_key: GroupId
  risk_note:
    Public IP 기반 ingress rule을 제거하면 정상적인 관리자 또는 외부 서비스의 접근까지 차단될 수 있으므로 승인
    후 실행한다
iam_role_administratoraccess_policy:
  policy: iam-role-administratoraccess-policy
  mode: approve
  auto_eligible: false
  auto_reason: Role을 사용하는 서비스의 실제 필요 권한 자동 검증 불가
  scope_key: RoleName
  risk_note:
    IAM Role에서 AdministratorAccess를 제거하면 해당 Role을 사용하는 서비스의 기존 AWS 작업 권한이
    제한되어 애플리케이션 동작에 영향을 줄 수 있으므로 승인 후 실행한다
iam_user_administrator_access_policy:
  policy: iam-user-administrator-access-policy
  mode: approve
  auto_eligible: false
  auto_reason: User가 수행 중인 관리 작업 및 실제 필요 권한 자동 검증 불가
  scope_key: UserName
  risk_note:
    IAM User에서 AdministratorAccess를 제거하면 해당 사용자가 수행하던 기존 AWS 관리 작업이 제한될 수
    있으므로 승인 후 실행한다
iam_password_policy_expires_passwords_within_90_days_or_less:
  policy: iam-password-policy-expires-passwords-within-90-days-or-less
  mode: approve
  auto_eligible: false
  auto_reason: 만료 정책 적용 시 기존 사용자에게 강제 비밀번호 변경 발생, 로그인 영향
  scope_key: null
  risk_note:
    Password 만료 정책을 90일로 설정하면 오래된 비밀번호를 사용하는 IAM User에게 비밀번호 변경이 요구될 수 있어
    사용자 접근에 영향을 줄 수 있으므로 승인 후 실행한다
