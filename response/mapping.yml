# Prowler 의 metadata.event_code 를 Cloud Custodian 정책에 연결한다.
# Custodian 은 findings 를 입력으로 받지 않고 AWS 를 직접 조회하므로,
# 두 도구의 유일한 연결점이 이 매핑이다.
#
# 이 파일은 **라우팅 테이블**이다. "이 체크를 어디로 보낼까"만 정한다.
# 조치가 어떤 성질인지(중단 여부·영향 범위·되돌릴 수 있는지)는 정책과 한 몸이라
# policies/<서비스>.yml 의 metadata 에 적는다. 정책을 리뷰하는 사람이 한 파일만
# 보고 판단할 수 있어야 하기 때문이다.
#
# 필드
#   policy      Custodian 정책 이름. 생략하면 check_id 의 언더바를 하이픈으로
#               바꾼 이름을 쓴다 (s3_bucket_kms_encryption -> s3-bucket-kms-encryption).
#               이름이 규칙과 다르면 명시하고, 실행할 정책이 없으면 null 을 적는다.
#   mode        approve / manual / not_supported
#               - approve       : 실행 후 사람에게 건별로 확인받는다
#               - manual        : Custodian 으로 조치할 수 없어 사람이 직접 한다.
#                                 도구는 안내만 한다
#               - not_supported : 조치 도구 자체가 없다
#   scope_key   실행 범위를 좁힐 때 쓸 Custodian 리소스 필드
#               (S3 는 Name, EC2 는 InstanceId). ARN 의 마지막 조각과 대조한다.
#               계정 단위 체크는 null 로 둔다
#   guide       mode=manual 일 때 사람이 무엇을 해야 하는지.
#               비워두면 Prowler 의 remediation.desc 를 그대로 쓴다.
#               우리 환경 특수사항이 있을 때만 적는다
#
# **auto 는 여기서 정하지 않는다.** 조치 가능한 체크는 전부 approve 로 시작하고,
# 사용자가 대시보드에서 "앞으로 자동 실행" 을 켜면 그때부터 auto 로 돈다.
# 자동화 자격은 policies/*.yml 의 metadata.auto 가 정한다.

s3_bucket_secure_transport_policy:
  mode: approve
  scope_key: Name

s3_bucket_kms_encryption:
  mode: approve
  scope_key: Name

s3_account_level_public_access_blocks:
  mode: approve
  scope_key: null       # 계정 단위 체크 - 리소스로 좁힐 수 없다

s3_bucket_no_mfa_delete:
  policy: null          # 조치 도구가 없다
  mode: not_supported

# 조치 도구는 있지만 Custodian 으로 안전하게 다룰 수 없어 사람이 처리하는 예시.
# policy 가 null 이라 실행되지 않고 안내 대상으로만 기록된다.
rds_instance_encryption:
  policy: null
  mode: manual
