# s3_account_level_public_access_blocks
#
# Severity: High
#
# 판정: ①YES → ②YES → ③NO → ④ approve
# 승격: blast_radius=account → auto_eligible: false
# ------------------------------------------------------------

s3_account_level_public_access_blocks:
  policy: s3-account-level-public-access-blocks
  mode: approve
  auto_eligible: false
  auto_reason: "계정 전체 S3 접근에 영향, 기존 공개 접근 필요 여부 자동 검증 불가"
  scope_key: null
  risk_note: "계정 전체의 S3 Public Access Block 설정을 변경하면 기존 공개 접근이 필요한 버킷이나 애플리케이션의 접근이 차단될 수 있으므로 승인 후 실행한다"


# ------------------------------------------------------------
# s3_bucket_kms_encryption
